<body style='width: calc(100vw - 16px); margin: 8px; height: 100vh; background-color: white;'>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"

  <!-- Carica le configurazioni (chiavi API) ignorate da Git -->
  <script src="config.js"></script>

  <script type="text/javascript">
    let months = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
    let months_names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    let days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    let days_ita = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];

    let currentDate = new Date();
    let myDate = currentDate.toString().slice(0, currentDate.toString().indexOf(currentDate.getFullYear().toString()) + 4);
    let myDayName = myDate.split(' ')[0];
    let myDay = myDate.split(' ')[2];
    let myMonth = (months_names.indexOf(myDate.split(' ')[1]) + 1).toString();
    let myYear = myDate.split(' ')[3];

    if (myMonth.length < 2) {
      myMonth = '0' + myMonth;
    }

    let dateToCompare = myYear + '-' + myMonth + '-' + myDay.replace(/\D/g, "");

    function updateDateTime() {
      let now = new Date();
      let timeString = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').innerText = days_ita[days.indexOf(myDayName)] + ' ' + myDay + ' ' + months[myMonth - 1] + ' ' + myYear + ', ' + timeString;
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    const CLIENT_ID = CONFIG.CLIENT_ID;
    const API_KEY = CONFIG.API_KEY;

    var mykey = CONFIG.MY_KEY;
    var calendarid = 'c_7ve6ne61m5cufeiu6q42oulipc@group.calendar.google.com';
    var calendarid_T2 = 'c_njnaf2jfu79f5qltnmcuijh9oc@group.calendar.google.com';
    var calendarid_T3 = 'c_ga9eia2je05c9ps8q4k0e3eqpo@group.calendar.google.com';
    var calendarid_E1 = 'c_dbatcro2252ae4lqp7lfn9st04@group.calendar.google.com';
    var calendarid_E2 = 'c_ap6r33ecsqmu8fu3siot6npbas@group.calendar.google.com';
    var calendarid_I1 = 'c_k39dcr2qk54to2c7r5b6tam3fk@group.calendar.google.com';
    var calendarid_I2 = 'c_9v59u24m67orm1bdo00ilpn7qk@group.calendar.google.com';
    var calendarid_F1 = 'c_m5kar9b71g3httgaur880epoc8@group.calendar.google.com';
    var calendarid_F2 = 'c_ha5sogjncfl2uihger5lich72k@group.calendar.google.com';

    let todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);
    let timeMinStr = todayStart.toISOString();

    let todayEnd = new Date();
    todayEnd.setHours(23, 59, 59, 999);
    let timeMaxStr = todayEnd.toISOString();

    let calendarParams = '&timeMin=' + timeMinStr + '&timeMax=' + timeMaxStr + '&singleEvents=true&maxResults=2500';

    $.ajax({
      type: 'GET',
      url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid + '/events?key=' + mykey + calendarParams), //Prof. Valentina Rachiele: ho aggiunto "maxResults=2500" il 17/11/2025 perché altrimenti la pagina non mostrava gli eventi successivi al 250esimo
      dataType: 'json',
      success: function (response) {
        const eventsT1 = response.items;
        fillEvents(eventsT1, 'TRIENNIO 1', 'T1');
        getT2();
      },
      error: function (response) {
        console.log('error!');
      }
    });

    function getT2() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_T2 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsT2 = response.items;
          fillEvents(eventsT2, 'TRIENNIO 2', 'T2');
          getT3();
        },
        error: function (response) {
          getT3();
        }
      });
    }

    function getT3() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_T3 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsT3 = response.items;
          fillEvents(eventsT3, 'TRIENNIO 3', 'T3');
          getE1();
        },
        error: function (response) {
          getE1();
        }
      });
    }

    function getE1() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_E1 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsE1 = response.items;
          fillEvents(eventsE1, 'EDITORIA 1', 'E1');
          getE2();
        },
        error: function (response) {
          getE2();
        }
      });
    }

    function getE2() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_E2 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsE2 = response.items;
          fillEvents(eventsE2, 'EDITORIA 2', 'E2');
          getI1();
        },
        error: function (response) {
          getI1();
        }
      });
    }

    function getI1() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_I1 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsI1 = response.items;
          fillEvents(eventsI1, 'ILLUSTRAZIONE 1', 'I1');
          getI2();
        },
        error: function (response) {
          getI2();

        }
      });
    }

    function getI2() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_I2 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsI2 = response.items;
          fillEvents(eventsI2, 'ILLUSTRAZIONE 2', 'I2');
          getF1();
        },
        error: function (response) {
          getF1();
        }
      });
    }

    function getF1() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_F1 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsF1 = response.items;
          fillEvents(eventsF1, 'FOTOGRAFIA 1', 'F1');
          getF2();
        },
        error: function (response) {
          getF2();
        }
      });
    }

    function getF2() {
      $.ajax({
        type: 'GET',
        url: encodeURI('https://www.googleapis.com/calendar/v3/calendars/' + calendarid_F2 + '/events?key=' + mykey + calendarParams),
        dataType: 'json',
        success: function (response) {
          const eventsF2 = response.items;
          fillEvents(eventsF2, 'FOTOGRAFIA 2', 'F2');

          setTimeout(function () {
            $('.title').each(function () {
              const $title = $(this);
              const $text = $title.find('.title-text');
              if ($text.length && $text[0].scrollWidth > $title.width()) {
                // Duplica il testo per lo scorrimento continuo
                const originalText = $text.text();
                $text.html(originalText + '<span class="spacer"></span>' + originalText);

                $text.addClass('scrolling');
                const duration = Math.max(10, ($text[0].scrollWidth / 130)) + 's';
                $text.css('animation-duration', duration);
              }
            });
          }, 100);
        },
        error: function (response) {
          //tell that an error has occurred
        }
      });
    }

    // Funzione helper per pulire l'HTML e estrarre il testo
    function stripHtmlTags(html) {
      var tmp = document.createElement("DIV");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    /*FILL*/
    //FILL EVENTS
    function fillEvents(myCourse, courseName, sigla) {

      $("body").append("<p class='courseName'>" + courseName + "</p>");
      $("body").append("<div id='content_" + sigla + "' class='content'></div>");

      // Valentina Rachiele (10.04.26): ordina gli eventi in base all'orario di inizio per assicurarsi che siano in ordine cronologico
      myCourse.sort(function (a, b) {
        var dateA = a.start && a.start.dateTime ? new Date(a.start.dateTime) : new Date(8640000000000000);
        var dateB = b.start && b.start.dateTime ? new Date(b.start.dateTime) : new Date(8640000000000000);
        return dateA - dateB;
      });

      for (i = 0; i < myCourse.length; i++) {

        if (myCourse[i].location) {
          var myLocation = myCourse[i].location;
        } else {
          var myLocation = '';
        }

        if (myCourse[i].start) {
          if ((myCourse[i].start.dateTime) && (dateToCompare == myCourse[i].start.dateTime.split('T')[0])) {

            var str_start = myCourse[i].start.dateTime.split('T')[1].split('+')[0]
            var myStartTime = str_start.slice(0, str_start.lastIndexOf(':'));
            var str_end = myCourse[i].end.dateTime.split('T')[1].split('+')[0]
            var myEndTime = str_end.slice(0, str_end.lastIndexOf(':'));

            var mySummary = myCourse[i].summary;
            /*var lastIndex = mySummary.substr(0, 40).lastIndexOf(" ");
            if (mySummary.length > 40){
              mySummary = mySummary.substr(0, 40).substr(0, lastIndex)+'…';
            }
              
            $( "#content_"+sigla+"" ).append( "<div class='row "+sigla+"_"+(i+1)+"'>"
              +"<div class='row_hour row_hour_"+(i+1)+"'>"+myStartTime+"–"+myEndTime+"</div>"
              +"<div class='title'>"+mySummary+"</div>"
              +"<div class='place'>"+myLocation+"</div>"
              +"</div>" );*/
            //Prof. Valentina Rachiele: ho commentato le righe dalla 246 alla 255 per evitare la troncatura dei titoli dei corsi troppo lunghi e ho aggiunto le righe dalla 258 alla 262 per ottenere poi i titoli in marquee

            $("#content_" + sigla + "").append("<div class='row " + sigla + "_" + (i + 1) + "'>"
              + "<div class='row_hour row_hour_" + (i + 1) + "'>" + myStartTime + "–" + myEndTime + "</div>"
              + "<div class='title'><span class='title-text'>" + mySummary + "</span></div>"
              + "<div class='place'>" + myLocation + "</div>"
              + "</div>");

            if ((myCourse[i].description) && (myCourse[i].description.includes('docent'))) {
              // Pulisci l'HTML prima di processare
              let cleanDescription = stripHtmlTags(myCourse[i].description);
              let professor_string = cleanDescription.split('docent')[1];

              if (!professor_string) { professor_string = " "; }

              //is singular or plural?
              if (professor_string[0] == 'e') {
                //singular
                // Estrai il testo dopo "docente " e prima di eventuali altri caratteri non alfabetici
                let professorFullName = professor_string.slice(2).trim();
                // Prendi tutto il nome completo (non solo i primi 2 elementi)
                let myProfessor = professorFullName;

                // Controlla se questo professore è già stato inserito per QUESTO evento specifico
                let professorAlreadyExists = $("." + sigla + "_" + (i + 1)).prev('.professor, .multiProfessor').length > 0;

                if (!professorAlreadyExists) {
                  $("<div class='professor'>" + myProfessor + "</div>")
                    .insertBefore($("#content_" + sigla + " > .row." + sigla + "_" + (i + 1) + ""));
                }
              } else if (professor_string[0] == 'i') {
                //plural
                let professor_names = professor_string.slice(2).trim().split(' e ');
                let professorAlreadyExists = $("." + sigla + "_" + (i + 1)).prev('.professor, .multiProfessor').length > 0;

                if (!professorAlreadyExists) {
                  $("<div class='multiProfessor professor_" + sigla + "_" + (i + 1) + "'></div>").insertBefore($("#content_" + sigla + " > .row." + sigla + "_" + (i + 1) + ""));

                  for (j = 0; j < professor_names.length; j++) {
                    if (j === 0) {
                      $(".professor_" + sigla + "_" + (i + 1) + "").append("<span class='professor'>" + professor_names[j] + "</span>");
                    } else {
                      $(".professor_" + sigla + "_" + (i + 1) + "").append("<span class='other_prof'>, " + professor_names[j] + "</span>");
                    }
                  }
                }
              }
            }

          }
        }
      }

      if ($("#content_" + sigla + " > .row").length == 2) {
      } else if ($("#content_" + sigla + " > .row").length == 1) {
        const thisStartHour = $($("#content_" + sigla + " > .row")[0]).find('.row_hour')[0].innerText.split(':')[0];
        if (thisStartHour < 12) {
          $("#content_" + sigla + "").append("<div class='row " + sigla + "_" + (i + 1) + "'>"
            + "<div class='row_hour row_hour_" + (i + 1) + "'>–</div>"
            + "<div class='title'>–</div>"
            + "<div class='place'></div>"
            + "</div>");
        } else {
          $("#content_" + sigla + "").prepend("<div class='row " + sigla + "_" + (i + 1) + "'>"
            + "<div class='row_hour row_hour_" + (i + 1) + "'>–</div>"
            + "<div class='title'>–</div>"
            + "<div class='place'></div>"
            + "</div>");
        }
      } else if ($("#content_" + sigla + " > .row").length == 0) {
        $("#content_" + sigla + "").append("<div class='row " + sigla + "_" + (i + 1) + "'>"
          + "<div class='row_hour row_hour_" + (i + 1) + "'>–</div>"
          + "<div class='title'>–</div>"
          + "<div class='place'></div>"
          + "</div>");
        $("#content_" + sigla + "").append("<div class='row " + sigla + "_" + (i + 1) + "'>"
          + "<div class='row_hour row_hour_" + (i + 1) + "'>–</div>"
          + "<div class='title'>–</div>"
          + "<div class='place'></div>"
          + "</div>");
      }
    }
  </script>
